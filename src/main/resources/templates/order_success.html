<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt hàng thành công - AppleStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS -->
    <link th:href="@{/css/Home.css}" rel="stylesheet" />
    <link th:href="@{/css/footer.css}" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">


    <!-- Tailwind để nhanh styling giống bản gốc; vẫn có Home.css để tinh chỉnh chi tiết -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                bg: '#0a0a0a',
                ink: '#f5f5f7',
                muted: '#a1a1aa',
                brand: '#2997ff'
              },
              fontFamily: {
                sf: ['-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','Helvetica Neue','Arial','Noto Sans']
              },
              boxShadow: { soft: '0 10px 40px rgba(0,0,0,.35)' }
            }
          }
        }
    </script>
</head>

<body>

<div th:replace="fragments/header :: header"></div>

<div class="container mt-4 mb-5">
    <div class="card p-4">

        <h3>Đặt hàng thành công </h3>

        <p>Mã đơn hàng của bạn:
            <strong th:text="${order.id}"></strong>
        </p>

        <p>Tổng tiền:
            <strong th:text="${@money.vnd(order.total)}"></strong>
        </p>

        <p>Hình thức thanh toán:
            <span th:text="${order.paymentType == 'BANK' ? 'Chuyển khoản ngân hàng' : 'Thanh toán khi nhận hàng (COD)'}"></span>
        </p>

        <!-- QR PAYMENT -->
        <div th:if="${qrDataUrl != null}" class="mt-3">
            <h5>Quét mã QR để thanh toán:</h5>
            <img th:src="${qrDataUrl}" alt="QR thanh toán" style="max-width:250px">
            <p class="mt-2">
                Ngân hàng: <strong th:text="${bankName}"></strong><br>
                Số tài khoản: <strong th:text="${bankAccountNumber}"></strong><br>
                Chủ TK: <strong th:text="${bankAccountName}"></strong>
            </p>
        </div>

        <hr>

        <h5>Chi tiết sản phẩm</h5>

        <table class="table">
            <thead>
            <tr>
                <th>Sản phẩm</th>
                <th>Loại</th>
                <th>SL</th>
                <th>Đơn giá</th>
                <th>Thành tiền</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="item : ${items}">

                <!-- Tên sản phẩm -->
                <td th:text="${item.product.name}"></td>

                <!-- Biến thể -->
                <td>
                    <span th:text="${item.variant != null && item.variant.color != null ? item.variant.color.name : '---'}"></span>
                    ·
                    <span th:text="${item.variant != null && item.variant.capacity != null ? item.variant.capacity.label : '---'}"></span>
                </td>

                <!-- Số lượng -->
                <td th:text="${item.quantity}"></td>

                <!-- Đơn giá -->
                <td th:text="${@money.vnd(item.unitPrice)}"></td>

                <!-- Thành tiền -->
                <td th:text="${@money.vnd(item.subtotal)}"></td>
            </tr>
            </tbody>

        </table>

        <a th:href="@{'/invoice/pdf?orderId=' + ${order.id}}" class="btn btn-outline-secondary mt-3">
            Tải hóa đơn PDF
        </a>

        <a th:href="@{/}" class="btn btn-primary mt-3 ms-2">
            Về trang chủ
        </a>

    </div>
</div>


<!--</footer>-->
<div th:replace="fragments/footer :: footer"></div>
<!-- JS -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const currentUser = /*[[${username}]]*/ null;
    console.log("Current user:", currentUser);
    /*]]>*/
</script>

<script th:src="@{/javascript/Home.js}"></script>

</body>
</html>


</body>
</html>
