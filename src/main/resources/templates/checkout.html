<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán - AppleStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/Home.css}" rel="stylesheet" />
    <link th:href="@{/css/footer.css}" rel="stylesheet" />

    <style>
        body { background-color: #f5f5f7; }

        /* --- Đổi toàn bộ màu chữ thành đen --- */
        body, h3, h5, label, span, strong, div, p {
            color: #000 !important;
        }

        .invoice-card {
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            background-color: #fff;
        }
        .product-thumb {
            width: 72px; height:72px;
            border-radius:10px; object-fit:cover;
        }
        .summary-box { padding:20px; background:#fafafa; border-radius:10px; }

        /* Nếu muốn giá vẫn xanh thì giữ lại */
        .price { color:#0071e3; font-weight:700; }

        .small-muted {
            color:#333 !important;      /* ← đổi từ xám nhạt sang đen đậm */
            font-size:0.9rem;
        }
    </style>
</head>

<body>
<div class="container mt-4 mb-5">
    <div class="invoice-card p-4">

        <h3 class="mb-3">Xác nhận đơn hàng</h3>

        <form th:action="@{/checkout}" method="post">

            <div class="row">

                <div class="col-lg-7">
                    <h5>Thông tin giao hàng</h5>

                    <div class="mb-3">
                        <label class="form-label">Họ và tên</label>
                        <input class="form-control" name="fullname" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input class="form-control" name="phone" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Địa chỉ</label>
                        <input class="form-control" name="address" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Ghi chú</label>
                        <textarea class="form-control" name="note" rows="2"></textarea>
                    </div>

                    <h5 class="mt-4">Phương thức thanh toán</h5>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="paymentType" value="cash" checked>
                        <label class="form-check-label">Thanh toán khi nhận hàng (COD)</label>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="paymentType" value="bank">
                        <label class="form-check-label">Chuyển khoản ngân hàng (QR)</label>
                    </div>

                    <button type="submit" class="btn btn-primary px-4 mt-2">Đặt hàng</button>
                </div>

                <!-- RIGHT -->
                <div class="col-lg-5">

                    <div class="summary-box">
                        <h5>Giỏ hàng của bạn</h5>

                        <div th:each="item : ${items}"
                             class="d-flex align-items-center mb-3 border-bottom pb-2">

                            <img th:src="@{|/images/${item.products.image}|}"
                                 class="product-thumb me-3"
                                 onerror="this.src='https://via.placeholder.com/72'">

                            <div class="flex-grow-1">
                                <strong th:text="${item.products.name}"></strong>

                                <div class="small-muted">
                                    Màu:
                                    <span th:text="${item.variant != null && item.variant.color != null ? item.variant.color.name : 'Không'}"></span>
                                    ·
                                    Dung lượng:
                                    <span th:text="${item.variant != null && item.variant.capacity != null ? item.variant.capacity.label : 'Không'}"></span>
                                </div>
                            </div>

                            <div class="text-end">
                                <div class="price" th:text="${@money.vnd(item.unitPrice)}"></div>

                                <div class="small-muted">
                                    x <span th:text="${item.quantity}"></span>
                                </div>

                                <div class="small-muted">
                                    Tạm tính:
                                    <span th:text="${@money.vnd(item.unitPrice * item.quantity)}"></span>
                                </div>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <strong>Tổng thanh toán:</strong>
                            <strong class="price" th:text="${@money.vnd(total)}"></strong>
                        </div>
                    </div>

                </div>

            </div>

        </form>

    </div>
</div>

</body>
</html>
