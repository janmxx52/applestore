<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng của bạn - AppleStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS -->
    <link th:href="@{/css/Home.css}" rel="stylesheet" />
    <link th:href="@{/css/Cart.css}" rel="stylesheet" />
    <link th:href="@{/css/header.css}" rel="stylesheet" />
    <link th:href="@{/css/footer.css}" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">


    <!-- Tailwind để nhanh styling giống bản gốc; vẫn có Home.css để tinh chỉnh chi tiết -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                bg: '#0a0a0a',
                ink: '#f5f5f7',
                muted: '#a1a1aa',
                brand: '#2997ff'
              },
              fontFamily: {
                sf: ['-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','Helvetica Neue','Arial','Noto Sans']
              },
              boxShadow: { soft: '0 10px 40px rgba(0,0,0,.35)' }
            }
          }
        }
    </script>
</head>

<body>

<header th:replace="fragments/header :: header"></header>

<div class="container cart-container">

    <!-- DANH SÁCH GIỎ HÀNG -->
    <div class="cart-items">
        <h4 class="section-title">🛒 Giỏ hàng của bạn</h4>

        <!-- Trường hợp giỏ hàng trống -->
        <div th:if="${#lists.isEmpty(cartItems)}" class="text-center text-muted py-5">
            Giỏ hàng trống. <a th:href="@{/}" class="text-primary">Mua sắm ngay</a>
        </div>

        <!-- Hiển thị sản phẩm -->
        <div th:each="item : ${cartItems}" class="d-flex align-items-center border-bottom py-3">

            <img th:src="@{'/images/' + ${item.products.image}}"
                 class="product-thumb me-3"
                 onerror="this.src='https://via.placeholder.com/80'">

            <div class="flex-grow-1">
                <h6 th:text="${item.products.name}" class="mb-1 fw-semibold"></h6>

                <!-- Màu + Dung lượng -->
                <p class="text-muted mb-1">
                    <span th:text="${item.variant != null ? item.variant.color.name : 'Mặc định'}"></span> •
                    <span th:text="${item.variant != null ? item.variant.capacity.label : ''}"></span>
                </p>

                <!-- XÓA -->
                <form th:action="@{/cart/remove}" method="post" class="d-inline">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <button class="btn btn-link text-danger p-0 small">Xóa</button>
                </form>
            </div>

            <!-- GIÁ -->
            <div class="text-end">
                <p class="mb-1 fw-bold"
                   th:text="${#numbers.formatDecimal(item.unitPrice,0,0,'COMMA') + ' ₫'}"></p>
                <p class="mb-0 text-secondary" th:text="'x ' + ${item.quantity}"></p>
            </div>

        </div>

    </div>

    <!-- TÓM TẮT ĐƠN HÀNG -->
    <div class="cart-summary">
        <h4 class="section-title">Tóm tắt đơn hàng</h4>

        <div class="d-flex justify-content-between mb-2">
            <span>Tạm tính</span>
            <span th:text="${total != null ? #numbers.formatDecimal(total,0,0,'COMMA') + ' ₫' : '0 ₫'}"></span>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <span>Phí giao hàng</span>
            <span>Miễn phí</span>
        </div>

        <hr>

        <div class="d-flex justify-content-between mb-3">
            <strong>Tổng cộng</strong>
            <strong class="total-price"
                    th:text="${total != null ? #numbers.formatDecimal(total,0,0,'COMMA') + ' ₫' : '0 ₫'}"></strong>
        </div>

        <a href="/checkout" class="checkout-btn text-center text-white">Tiến hành thanh toán</a>
    </div>
</div>
<!--</footer>-->
<div th:replace="fragments/footer :: footer"></div>
<!-- JS -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const currentUser = /*[[${username}]]*/ null;
    console.log("Current user:", currentUser);
    /*]]>*/
</script>

<script th:src="@{/javascript/Home.js}"></script>

</body>


</html>
