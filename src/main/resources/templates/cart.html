<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng của bạn - AppleStore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link th:href="@{/css/header.css}" rel="stylesheet" />
    <link th:href="@{/css/footer.css}" rel="stylesheet" />
    <style>
        body {
          background-color: #f5f5f7;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
          color: #1d1d1f;
        }
        .cart-container {
          display: flex;
          flex-wrap: wrap;
          gap: 30px;
          margin-top: 40px;
        }
        .cart-items {
          flex: 2;
          background: white;
          border-radius: 20px;
          padding: 25px;
          box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .cart-summary {
          flex: 1;
          background: white;
          border-radius: 20px;
          padding: 25px;
          box-shadow: 0 4px 15px rgba(0,0,0,0.05);
          height: fit-content;
        }
        .product-thumb {
          width: 80px;
          height: 80px;
          object-fit: cover;
          border-radius: 12px;
        }
        .qty-input {
          width: 70px;
          text-align: center;
          border: 1px solid #ccc;
          border-radius: 6px;
        }
        .total-price {
          font-size: 1.5rem;
          font-weight: 600;
          color: #0071e3;
        }
        .checkout-btn {
          background-color: #0071e3;
          color: white;
          font-size: 1.1rem;
          font-weight: 500;
          border-radius: 10px;
          width: 100%;
          padding: 12px 0;
          transition: all 0.2s ease;
        }
        .checkout-btn:hover {
          background-color: #005bb5;
        }
        h4.section-title {
          border-bottom: 2px solid #eee;
          padding-bottom: 10px;
          margin-bottom: 20px;
        }
    </style>
</head>
<body>
<header th:replace="fragments/header :: header"></header>


<div class="container cart-container">
    <!-- Danh sách sản phẩm -->
    <div class="cart-items">
        <h4 class="section-title">🛒 Giỏ hàng của bạn</h4>

        <!-- ✅ Phòng thủ: nếu giỏ hàng trống -->
        <div th:if="${cart == null or #lists.isEmpty(cart.items)}" class="text-center text-muted py-5">
            Giỏ hàng trống. <a th:href="@{/shop/iphone}" class="text-primary">Mua sắm ngay</a>
        </div>

        <!-- ✅ Hiển thị danh sách sản phẩm -->
        <div th:if="${cart != null and !#lists.isEmpty(cart.items)}"
             th:each="item : ${cart.items}"
             class="d-flex align-items-center border-bottom py-3">

            <img th:src="@{'/images/' + ${item.products.image}}" class="product-thumb me-3">
            <div class="flex-grow-1">
                <h6 th:text="${item.products.name}" class="mb-1 fw-semibold"></h6>
                <p class="text-muted mb-1">
                    <span th:text="${item.variant != null ? item.variant.color.name : 'Mặc định'}"></span> •
                    <span th:text="${item.variant != null ? item.variant.capacity.label : ''}"></span>
                </p>
                <form th:action="@{/cart/remove}" method="post" class="d-inline">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <button class="btn btn-link text-danger p-0 small">Xóa</button>
                </form>
            </div>
            <div class="text-end">
                <p class="mb-1 fw-bold" th:text="${#numbers.formatDecimal(item.unitPrice,0,0,'COMMA') + ' ₫'}"></p>
                <p class="mb-0 text-secondary" th:text="'x ' + ${item.quantity}"></p>
            </div>
        </div>
    </div>

    <!-- Thông tin & đặt hàng -->
    <div class="cart-summary">
        <h4 class="section-title">Tóm tắt đơn hàng</h4>

        <div class="d-flex justify-content-between mb-2">
            <span>Tạm tính</span>
            <span th:text="${total != null ? #numbers.formatDecimal(total,0,0,'COMMA') + ' ₫' : '0 ₫'}"></span>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <span>Phí giao hàng</span>
            <span>Miễn phí</span>
        </div>

        <hr>
        <div class="d-flex justify-content-between mb-3">
            <strong>Tổng cộng</strong>
            <strong class="total-price"
                    th:text="${total != null ? #numbers.formatDecimal(total,0,0,'COMMA') + ' ₫' : '0 ₫'}"></strong>
        </div>

        <form th:action="@{/checkout}" method="post">
            <div class="mb-3">
                <label class="form-label">Họ và tên</label>
                <input type="text" name="fullname" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Số điện thoại</label>
                <input type="text" name="phone" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Địa chỉ nhận hàng</label>
                <input type="text" name="address" class="form-control" placeholder="Số nhà, tên đường..." required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="policy" required>
                <label class="form-check-label" for="policy">
                    Tôi đồng ý với <a href="#">chính sách xử lý dữ liệu cá nhân</a>.
                </label>
            </div>
            <button type="submit" class="checkout-btn">Đặt hàng</button>
        </form>
    </div>
</div>
<div th:replace="/fragments/footer :: footer"></div>
<script th:inline="javascript">
    /*<![CDATA[*/
    const currentUser = /*[[${username}]]*/ null;
    console.log("Current user:", currentUser);
    /*]]>*/
</script>

<script th:src="@{/javascript/Home.js}"></script>

</body>
</html>
